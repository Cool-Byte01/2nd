lines:
  - pre: ""
    accent: "Fatum brutum amor fati.\n - Neitzsche"

  - pre: "Ever has it been that love knows not its own depth "
    accent: "until the hour of separation.\n - Kahlil Gibran"

  - pre: "I'm not upset that you lied to me, "
    accent: "I'm upset that from now on I can't believe you.\n - Neitzsche"

  - pre: "When you are sorrowful look again in your heart, and you shall see that in truth "
    accent: "you are weeping for that which has been your delight. \n - Kahlil Gibran"

  - pre: "You have your way. I have my way."
    accent: "As for the right way, the correct way, and the only way, it does not exist. \n - Neitzsche"

  - pre: "Keep silent, because the world of silence is a vast fullness.\n"
    accent: "- Rumi"
